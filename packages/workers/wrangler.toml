name = "lonecrafts-api"
main = "src/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "lonecrafts-api-prod"
route = "api.lonecrafts.com/*"
zone_id = ""

[env.staging]
name = "lonecrafts-api-staging"
route = "staging-api.lonecrafts.com/*"
zone_id = ""

[[d1_databases]]
binding = "DB"
database_name = "lonecrafts"
database_id = "deaf0edd-2632-437f-b915-677265ec6d55"

[[env.production.d1_databases]]
binding = "DB"
database_name = "lonecrafts-prod"
database_id = "deaf0edd-2632-437f-b915-677265ec6d55"

# Tigris Object Storage bindings (configured via wrangler secrets)
# Set these values using: wrangler secret put TIGRIS_ENDPOINT_URL
# wrangler secret put TIGRIS_ACCESS_KEY_ID
# wrangler secret put TIGRIS_SECRET_ACCESS_KEY
# wrangler secret put TIGRIS_BUCKET
